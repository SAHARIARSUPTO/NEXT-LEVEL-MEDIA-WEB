<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 1200" fill="none" preserveAspectRatio="none">
  <defs>
    <filter id="fog-blur-1" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
    <filter id="fog-blur-2" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur stdDeviation="110" />
    </filter>
    <radialGradient id="fog-grad-1" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#535eee" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="fog-grad-2" cx="10%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#8d96ff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#535eee" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="fog-grad-3" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#535eee" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Layer 1: Ambient Upper Mist Plume -->
  <path d="M-100,50 Q180,120 220,380 T-60,650 Z" fill="url(#fog-grad-1)" filter="url(#fog-blur-1)" />

  <!-- Layer 2: Lower Ambient Smoke Plume -->
  <path d="M-80,450 Q260,600 240,950 T-80,1180 Z" fill="url(#fog-grad-2)" filter="url(#fog-blur-2)" />

  <!-- Layer 3: Central Dense Fog Core -->
  <ellipse cx="60" cy="600" rx="220" ry="450" fill="url(#fog-grad-3)" filter="url(#fog-blur-1)" />
</svg>
